name: Screenshot Sample

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  Build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ui/espresso/ScreenshotSample
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm
      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu' # See 'Supported distributions' for available options
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: android-actions/setup-android@v3.2.2
      - run: sdkmanager platform-tools
      - run: ./gradlew assembleDebug nexusOneApi30DebugAndroidTest
      - name: List screenshots
        run: find ./app/build/outputs/managed_device_android_test_additional_output -name "*.png"
      - name: Archive screenshots
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: Screenshots
          path: |
            ui/espresso/ScreenshotSample/app/build/outputs/managed_device_android_test_additional_output
